<!doctype html><html><head><meta charset="utf-8"><title>map render</title>
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/vietnamese-700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/vietnamese-800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/vietnamese-900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/latin-700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/latin-800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/latin-900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/latin-ext-800.css">
</head>
<body style="margin:0;background:#000">
<canvas id="cv" width="576" height="1024"></canvas>
<script src="../app/map-engine.js"></script>
<script src="../app/map-styles.js"></script>
<script>
// Chạy một job bản đồ.
//  job.style trống/"classic": tìm hạ tầng → tuyến → ảnh vệ tinh → quay (mở đầu nghiêng + các cảnh chủ đề + toàn vùng).
//  job.style = gmap | navy | quyhoach | neon: MapStyles (nhìn thẳng), có lời đọc cho navy/quyhoach.
// Hai bước cho phong cách có lời đọc: prepareJob (lấy dữ liệu + câu đọc) → máy chủ đọc thành tiếng → runJob(job, durs).
window.runJob = async (job, durs) => { try { return await runJobInner(job, durs); } catch (e) { throw new Error(String(e && e.stack || e)); } };
window.prepareJob = async (job) => { try { return await prepare(job); } catch (e) { throw new Error(String(e && e.stack || e)); } };
const logs = []; const L = (m) => { logs.push(m); console.log("[map] " + m); };
const cfgOf = (job) => ({ lat: +job.lat, lon: +job.lon, name: job.name || "DỰ ÁN", area: job.area || null, label: job.label || "", style: job.style || "classic",
  facts: job.facts || {}, radiusMin: +job.radiusMin || 8, radiusKm: +job.radiusKm || 2.5,
  pois: (job.pois || []).map((p) => Array.isArray(p) ? p : [p.cat || "", p.name || ""]).filter((p) => p[1]) });
let DATA = null;
async function prepare(job) {
  await document.fonts.ready;
  const cfg = cfgOf(job);
  DATA = await MapStyles.gather(cfg, L);
  const say = MapStyles.narration(cfg, DATA).map((s) => ({ ...s, tts: MapStyles.ttsText(s.text) }));
  return { say, logs };
}
async function buildEngine(job, durs) {
  const cfg = cfgOf(job);
  if (cfg.style === "classic") {
    const found = await MapEngine.discover(cfg, L);
    if (!found.length) throw new Error("Không tìm thấy hạ tầng nào quanh tọa độ này.");
    const pois = await MapEngine.route(cfg, found, L);
    if (!pois.length) throw new Error("Không lấy được tuyến đường nào.");
    return { eng: MapEngine.build(cfg, pois), TI: 2.6 };
  }
  if (!DATA) await prepare(job);
  return { eng: MapStyles.build(cfg, DATA, durs || []), TI: 0 };
}
async function runJobInner(job, durs) {
  await document.fonts.ready;
  const FPS = 30;
  const { eng, TI } = await buildEngine(job, durs);
  L(`${eng.themes.length} chủ đề (${eng.T.toFixed(1)}s)`);
  const pf = await eng.prefetch.length >= 2 ? await eng.prefetch(TI, (d, n) => { if (d % 100 === 0) L(`ảnh nền ${d}/${n}`); }) : await eng.prefetch((d, n) => { if (d % 100 === 0) L(`ảnh nền ${d}/${n}`); });
  if (pf.failed > pf.total * 0.05) throw new Error(`Quá nhiều ô ảnh nền lỗi (${pf.failed}/${pf.total}).`);
  L(`Đã tải ${pf.total} ô ảnh nền, ${JSON.stringify(eng.calibrate())}`);
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const total = TI + eng.T;
  const draw = (t) => (t < TI ? eng.renderIntro(ctx, t, TI, []) : eng.render(ctx, t - TI, []));
  if (job.framesAt) { // chế độ kiểm thử: trả về ảnh tại các giây
    const out = []; for (const t of job.framesAt) { draw(Math.min(t, total - 0.01)); out.push(cv.toDataURL("image/jpeg", 0.85)); }
    return { frames: out, T: eng.T, TI, shots: eng.shots, logs };
  }
  const stream = cv.captureStream(FPS);
  const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 10e6 });
  const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  const done = new Promise((r) => (rec.onstop = r));
  rec.start(250);
  const N = Math.round(total * FPS), t0 = performance.now(); let late = 0;
  for (let i = 0; i < N; i++) {
    draw(i / FPS);
    const wait = t0 + (i + 1) * 1000 / FPS - performance.now();
    if (wait > 0) await new Promise((r) => setTimeout(r, wait)); else { late++; await new Promise((r) => setTimeout(r, 0)); }
  }
  await new Promise((r) => setTimeout(r, 300)); rec.stop(); await done;
  const blob = new Blob(chunks, { type: "video/webm" });
  const buf = new Uint8Array(await blob.arrayBuffer()); let bin = "";
  for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  const themes = eng.themes.map((t) => ({ title: t.title, items: t.items.map((p) => ({ name: p.name, km: +(+p.km).toFixed(1), min: Math.round(p.min || 0) })) }));
  return { webm: btoa(bin), themes, TI, T: eng.T, N: eng.N, SC: 4.6, PS: eng.PS, shots: eng.shots || [], style: job.style || "classic", late, logs };
}
</script></body></html>
